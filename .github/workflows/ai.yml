name: Ghostty Download Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  download_ghostty_deps:
    runs-on: macos-latest

    steps:
      - name: Checkout Ghostty
        uses: actions/checkout@v4
        with:
          repository: ghostty-org/ghostty
          fetch-depth: 1
          path: ghostty

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Fetch zig dependencies
        # Use continue-on-error because we expect the full build to fail on macos,
        # but we only care about the dependencies downloaded before it fails.
        continue-on-error: true
        run: |
          cd ghostty
          # Force the global cache to a local directory so we can bundle it.
          # We use 'build' because it triggers the fetch and doesn't exit prematurely.
          export ZIG_GLOBAL_CACHE_DIR=$(pwd)/zig-pkg
          uvx --from ziglang==0.15.2 python-zig build

      - name: Bundle zig-pkg
        run: |
          # If zig-pkg doesn't exist, this will fail as requested.
          tar -cvf zig-pkg.tar -C ghostty zig-pkg

      - name: Upload zig-pkg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zig-pkg
          path: zig-pkg.tar
