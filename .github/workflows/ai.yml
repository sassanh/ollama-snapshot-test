name: Download Test Item

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  download_bundle:
    runs-on: ubuntu-latest

    env:
      DOWNLOAD_URL: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.0.3-6242596486512640/darwin-arm/Antigravity%20IDE.dmg

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download
        run: |
          echo "Starting download"
          curl -L -o file ${{ env.DOWNLOAD_URL }}
          echo "Download complete."

      - name: Compress Installer
        run: |
          tar -cf bundle.tar file

      - name: Upload Installer Snapshot
        uses: actions/upload-artifact@v6
        with:
          name: bundle
          path: bundle.tar
          compression-level: 0
